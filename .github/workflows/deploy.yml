# Проверки и публикация статичного билда в GitHub Pages.
#
# - pull request в master: lint, unit-тесты, e2e в Chrome и сборка (без публикации);
# - push в master / ручной запуск: то же самое, и если всё зелёное — деплой на Pages.
#
# Один раз в репозитории: Settings → Pages → Build and deployment → Source: «GitHub Actions».
name: CI and deploy to GitHub Pages

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  # Позволяет запустить воркфлоу вручную из вкладки Actions
  workflow_dispatch:

# По умолчанию токену достаточно читать код; нужные права выдаются конкретным job'ам ниже.
permissions:
  contents: read

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          cache: true
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test

  e2e:
    name: E2E tests (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          cache: true
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Playwright использует установленный на раннере Google Chrome (channel: 'chrome'),
      # браузеры скачивать не нужно.
      - name: E2E tests
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          cache: true
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # base_path: «/<имя-репозитория>» для project-сайта или пусто для своего домена / user-сайта.
      - name: Setup Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      # `pnpm build` = tsc -b (проверка типов) + vite build. BASE_PATH читает vite.config.ts.
      - name: Build
        run: pnpm build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    # Публикуем только после зелёных проверок и только не из pull request'а.
    if: github.event_name != 'pull_request'
    needs: [test, e2e, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Одновременно идёт только один деплой; уже запущенный не отменяем, чтобы он дошёл до конца.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
