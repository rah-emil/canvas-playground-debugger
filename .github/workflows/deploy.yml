# Checks and publishing of the static build to GitHub Pages.
#
# - pull request to master: lint, unit tests, e2e in Chrome and a build (no publishing);
# - push to master / manual run: the same, and if everything is green, a deploy to Pages.
#
# Once per repository: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: CI and deploy to GitHub Pages

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  # Allows running the workflow manually from the Actions tab
  workflow_dispatch:

# By default the token may only read code; the needed permissions are granted to specific jobs below.
permissions:
  contents: read

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          cache: true
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test

  e2e:
    name: E2E tests (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          cache: true
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Playwright uses the Google Chrome installed on the runner (channel: 'chrome'),
      # so no browsers need to be downloaded.
      - name: E2E tests
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          cache: true
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # base_path: "/<repository-name>" for a project site, or empty for a custom domain / user site.
      - name: Setup Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      # `pnpm build` = tsc -b (type check) + vite build. BASE_PATH is read by vite.config.ts.
      - name: Build
        run: pnpm build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    # Publish only after green checks and never from a pull request.
    if: github.event_name != 'pull_request'
    needs: [test, e2e, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Only one deploy runs at a time; one already in progress is not cancelled so that it can finish.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
